<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Cake Share 🎂</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101827;
  --panel: #1c293b;
  --panel2: #26364b;
  --text: #f7f4ef;
  --muted: #aab7c8;
  --accent: #ff8eaa;
  --border: rgba(255,255,255,.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
button, input, select {
  font: inherit;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 11px 15px;
  color: white;
  background: #405675;
  cursor: pointer;
  touch-action: manipulation;
}
button:active { transform: scale(.97); }
button.primary { background: #e66f91; }
button.secondary { background: #34465f; }
button.danger { background: #a74755; }
input, select {
  width: 100%;
  min-width: 0;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #101a29;
  color: white;
}
label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0 5px;
}
#app {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: 100dvh;
}
#editor {
  overflow-y: auto;
  padding: 16px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  z-index: 2;
}
h1 { font-size: 21px; margin: 0 0 5px; }
h2 { font-size: 14px; margin: 22px 0 8px; }
p, small { color: var(--muted); }
.group {
  padding: 12px;
  background: rgba(255,255,255,.045);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-top: 10px;
}
.row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.row > * { flex: 1; }
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
#stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #101827;
}
#scene {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#topbar {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
#cakeTitle {
  background: rgba(10,15,25,.65);
  backdrop-filter: blur(12px);
  padding: 9px 13px;
  border-radius: 12px;
  max-width: 65%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#hint {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(10,15,25,.7);
  padding: 9px 14px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  text-align: center;
  pointer-events: none;
  max-width: 90%;
}
#vrExit {
  display: none;
  position: absolute;
  z-index: 10;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
}
#status {
  font-size: 12px;
  color: var(--muted);
  margin-top: 10px;
  overflow-wrap: anywhere;
}
#nameGate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(5,10,20,.88);
}
#nameCard {
  width: min(420px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 22px;
  border-radius: 20px;
}
#nameCard h1 { margin-bottom: 8px; }
#toast {
  position: fixed;
  z-index: 100;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 16px;
  background: #26364b;
  border: 1px solid var(--border);
  border-radius: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
#toast.show { opacity: 1; }

/* Cardboard: 編集UIを完全に消して映像だけにする */
body.cardboard #editor,
body.cardboard #topbar,
body.cardboard #hint {
  display: none !important;
}
body.cardboard #app {
  display: block;
}
body.cardboard #stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
}
body.cardboard #scene {
  width: 100%;
  height: 100%;
}
body.cardboard #vrExit {
  display: block;
}
body.cardboard {
  cursor: none;
}

@media (max-width: 700px) {
  #app {
    display: flex;
    flex-direction: column;
  }
  #stage {
    order: 1;
    flex: 1;
    min-height: 42dvh;
  }
  #editor {
    order: 2;
    width: 100%;
    height: 58dvh;
    border-right: 0;
    border-top: 1px solid var(--border);
    padding: 12px;
  }
  #topbar { top: 8px; left: 8px; right: 8px; }
  #hint { bottom: 8px; }
}
</style>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="nameGate">
  <div id="nameCard">
    <h1>🎂 Cake Share</h1>
    <p>ケーキをデコレーションして、みんなで共有しよう。</p>
    <label for="editorName">あなたの名前</label>
    <input id="editorName" maxlength="24" placeholder="ニックネーム">
    <button class="primary" id="enterButton" style="width:100%;margin-top:14px">
      はじめる
    </button>
  </div>
</div>

<div id="app">
  <aside id="editor">
    <h1>🎂 Cake Share</h1>
    <small>みんなで作る3Dクリスマスケーキ</small>

    <div class="group">
      <label>ケーキの名前</label>
      <input id="cakeName" maxlength="40" value="クリスマスケーキ">
      <button id="renameButton" class="primary" style="width:100%;margin-top:8px">
        名前を変更
      </button>
      <button id="shareButton" style="width:100%;margin-top:8px">
        🔗 共有リンクをコピー
      </button>
    </div>

    <h2>ケーキのデザイン</h2>
    <div class="group">
      <label>味のプリセット</label>
      <select id="flavor">
        <option value="strawberry">🍓 いちご</option>
        <option value="chocolate">🍫 チョコレート</option>
        <option value="matcha">🍵 抹茶</option>
        <option value="blueberry">🫐 ブルーベリー</option>
      </select>

      <label>クリームの色</label>
      <input type="color" id="creamColor" value="#fff1e8">

      <label>スポンジの色</label>
      <input type="color" id="spongeColor" value="#e9ad67">

      <label>メッセージチョコの色</label>
      <input type="color" id="chocoColor" value="#6b352d">

      <label>ケーキのメッセージ</label>
      <input id="cakeMessage" maxlength="32" placeholder="Merry Christmas!">
      <button id="messageButton" style="width:100%;margin-top:8px">
        メッセージを反映
      </button>
    </div>

    <h2>デコレーション</h2>
    <div class="group grid2">
      <button data-add="strawberry">🍓 いちご</button>
      <button data-add="candle">🕯️ キャンドル</button>
      <button data-add="chocolate">🍫 チョコ</button>
      <button data-add="star">⭐ 星</button>
    </div>

    <h2>選択中のオブジェクト</h2>
    <div class="group">
      <div class="grid2">
        <button data-move="left">← 左</button>
        <button data-move="right">右 →</button>
        <button data-move="front">手前</button>
        <button data-move="back">奥</button>
        <button data-move="up">上</button>
        <button data-move="down">下</button>
      </div>
      <div class="grid2" style="margin-top:8px">
        <button id="rotateButton">↻ 回転</button>
        <button id="deleteButton" class="danger">削除</button>
      </div>
      <small>オブジェクトをタップして選択できます。</small>
    </div>

    <h2>背景</h2>
    <div class="group">
      <select id="room">
        <option value="classic">🎄 クリスマスの部屋</option>
        <option value="snow">❄️ 雪の降る夜</option>
        <option value="nordic">🪵 北欧の部屋</option>
        <option value="party">🎉 パーティールーム</option>
        <option value="night">🌌 星空の部屋</option>
      </select>
    </div>

    <h2>操作</h2>
    <div class="group grid2">
      <button id="undoButton">↶ Undo</button>
      <button id="redoButton">↷ Redo</button>
      <button id="saveButton">💾 保存</button>
      <button id="vrButton" class="primary">🥽 Cardboard</button>
    </div>

    <div class="group">
      <button id="gyroButton" style="width:100%">📱 ジャイロ操作</button>
      <button id="xrButton" style="width:100%;margin-top:8px">VRモード（WebXR）</button>
    </div>

    <div id="status">ローカル保存モード</div>
  </aside>

  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="topbar">
      <div id="cakeTitle">🎂 クリスマスケーキ</div>
      <small>CAKE SHARE</small>
    </div>
    <div id="hint">ドラッグで視点移動・タップでデコレーションを選択</div>
    <button id="vrExit">Cardboardを終了</button>
  </main>
</div>

<div id="toast"></div>

<script type="module">
import * as THREE from "three";

/* =========================================================
   Supabase設定
   URLと公開用キーをここに埋め込む。
   service_role / secret key は絶対に使用しない。
========================================================= */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

/* =========================================================
   基本設定
========================================================= */
const $ = id => document.getElementById(id);
const canvas = $("scene");

const params = new URLSearchParams(location.search);
const cakeId = params.get("cake") || crypto.randomUUID();
if (!params.has("cake")) {
  params.set("cake", cakeId);
  history.replaceState(null, "", location.pathname + "?" + params);
}

let editorName = "";
let cakeTitle = "クリスマスケーキ";
let selectedObject = null;
let decorations = [];
let undoStack = [];
let redoStack = [];
let lastSnapshot = "";
let supabase = null;
let realtimeChannel = null;
let applyingRemote = false;
let saveTimer = null;
let cardboardMode = false;
let gyroEnabled = false;
let xrSession = null;

const defaultState = {
  title: cakeTitle,
  flavor: "strawberry",
  cream: "#fff1e8",
  sponge: "#e9ad67",
  chocolate: "#6b352d",
  message: "",
  room: "classic",
  decorations: []
};

let state = structuredClone(defaultState);

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

function setStatus(message) {
  $("status").textContent = message;
}

/* =========================================================
   名前入力
========================================================= */
$("enterButton").addEventListener("click", () => {
  const name = $("editorName").value.trim();
  if (!name) {
    toast("名前を入力してください");
    return;
  }
  editorName = name;
  sessionStorage.setItem("cakeShareName", name);
  $("nameGate").style.display = "none";
  initializeHistory();
});

const storedName = sessionStorage.getItem("cakeShareName");
if (storedName) {
  editorName = storedName;
  $("editorName").value = storedName;
  $("nameGate").style.display = "none";
  initializeHistory();
}

/* =========================================================
   Three.js シーン
========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color("#18263b");

const camera = new THREE.PerspectiveCamera(
  45, 1, 0.1, 100
);
camera.position.set(0, 3.2, 7.5);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xffffff, 0x536078, 2));

const keyLight = new THREE.DirectionalLight(0xffe4c8, 3);
keyLight.position.set(4, 8, 5);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x8dbbff, 35, 20);
fillLight.position.set(-4, 3, -3);
scene.add(fillLight);

const cakeGroup = new THREE.Group();
scene.add(cakeGroup);

const roomGroup = new THREE.Group();
scene.add(roomGroup);

const decorationGroup = new THREE.Group();
scene.add(decorationGroup);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function material(color, roughness = .65, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

function makeCylinder(radiusTop, radiusBottom, height, color, y) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 64),
    material(color)
  );
  mesh.position.y = y;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* =========================================================
   ケーキ生成
========================================================= */
function clearGroup(group) {
  while (group.children.length) {
    const obj = group.children.pop();
    obj.geometry?.dispose();
    if (Array.isArray(obj.material)) {
      obj.material.forEach(m => m.dispose());
    } else {
      obj.material?.dispose();
    }
  }
}

function buildCake() {
  clearGroup(cakeGroup);

  cakeGroup.add(makeCylinder(1.35, 1.35, .16, "#d7dce5", .08));
  cakeGroup.add(makeCylinder(1.12, 1.12, .55, state.sponge, .43));
  cakeGroup.add(makeCylinder(1.16, 1.16, .12, state.cream, .76));
  cakeGroup.add(makeCylinder(1.05, 1.05, .48, state.sponge, 1.06));
  cakeGroup.add(makeCylinder(1.10, 1.10, .13, state.cream, 1.36));

  // 上面のクリーム
  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(1.1, 1.1, .08, 64),
    material(state.cream)
  );
  top.position.y = 1.47;
  top.castShadow = true;
  cakeGroup.add(top);

  // クリームの絞り
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2;
    const cream = new THREE.Mesh(
      new THREE.SphereGeometry(.12, 18, 14),
      material(state.cream)
    );
    cream.position.set(
      Math.cos(a) * .88,
      1.57,
      Math.sin(a) * .88
    );
    cream.scale.y = 1.2;
    cakeGroup.add(cream);
  }

  // メッセージプレート
  if (state.message) {
    const textureCanvas = document.createElement("canvas");
    textureCanvas.width = 1024;
    textureCanvas.height = 256;
    const ctx = textureCanvas.getContext("2d");
    ctx.clearRect(0, 0, 1024, 256);
    ctx.fillStyle = state.chocolate;
    ctx.font = "bold 100px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(state.message, 512, 128, 950);

    const texture = new THREE.CanvasTexture(textureCanvas);
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(1.8, .45),
      new THREE.MeshStandardMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide
      })
    );
    sign.position.set(0, 1.78, .03);
    cakeGroup.add(sign);
  }

  rebuildDecorations();
}

/* =========================================================
   デコレーション
========================================================= */
function createDecoration(type, position) {
  const group = new THREE.Group();
  group.userData.decoration = true;
  group.userData.type = type;
  group.position.copy(position);

  if (type === "strawberry") {
    const berry = new THREE.Mesh(
      new THREE.SphereGeometry(.17, 24, 18),
      material("#e52f50", .35)
    );
    berry.scale.set(.85, 1.15, .85);
    berry.castShadow = true;
    group.add(berry);

    for (let i = 0; i < 5; i++) {
      const leaf = new THREE.Mesh(
        new THREE.ConeGeometry(.055, .18, 8),
        material("#43a66a")
      );
      const a = i / 5 * Math.PI * 2;
      leaf.position.set(Math.cos(a) * .08, .17, Math.sin(a) * .08);
      leaf.rotation.z = -.5;
      group.add(leaf);
    }
  }

  if (type === "candle") {
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(.045, .045, .48, 16),
      material("#fff0d2")
    );
    body.position.y = .24;
    group.add(body);

    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(.07, .2, 16),
      new THREE.MeshBasicMaterial({ color: "#ffb52e" })
    );
    flame.position.y = .58;
    group.add(flame);
  }

  if (type === "chocolate") {
    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(.34, .12, .24),
      material(state.chocolate, .3)
    );
    bar.position.y = .06;
    group.add(bar);
  }

  if (type === "star") {
    const star = new THREE.Mesh(
      new THREE.OctahedronGeometry(.18, 0),
      new THREE.MeshStandardMaterial({
        color: "#ffd45c",
        metalness: .55,
        roughness: .25,
        emissive: "#553500"
      })
    );
    group.add(star);
  }

  group.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.userData.parentDecoration = group;
    }
  });

  decorationGroup.add(group);
  decorations.push(group);
  return group;
}

function rebuildDecorations() {
  clearGroup(decorationGroup);
  decorations = [];

  for (const item of state.decorations) {
    const obj = createDecoration(
      item.type,
      new THREE.Vector3(item.x, item.y, item.z)
    );
    obj.rotation.y = item.ry || 0;
    obj.scale.setScalar(item.scale || 1);
  }
}

function serializeDecorations() {
  return decorations.map(obj => ({
    type: obj.userData.type,
    x: obj.position.x,
    y: obj.position.y,
    z: obj.position.z,
    ry: obj.rotation.y,
    scale: obj.scale.x
  }));
}

/* =========================================================
   背景
========================================================= */
function buildRoom() {
  clearGroup(roomGroup);

  const roomColors = {
    classic: "#25364c",
    snow: "#172b49",
    nordic: "#8a7767",
    party: "#382747",
    night: "#101b38"
  };

  scene.background = new THREE.Color(
    roomColors[state.room] || roomColors.classic
  );

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    material(state.room === "nordic" ? "#a98d70" : "#34445b")
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -.02;
  floor.receiveShadow = true;
  roomGroup.add(floor);

  // 壁
  const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 12),
    material(roomColors[state.room])
  );
  wall.position.set(0, 5, -7);
  roomGroup.add(wall);

  // クリスマスツリー
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(.13, .18, .7, 16),
    material("#765039")
  );
  trunk.position.set(-3, .35, -2);
  roomGroup.add(trunk);

  for (let i = 0; i < 3; i++) {
    const tree = new THREE.Mesh(
      new THREE.ConeGeometry(1.05 - i * .2, 1.55, 24),
      material("#176747")
    );
    tree.position.set(-3, 1.15 + i * .75, -2);
    roomGroup.add(tree);
  }

  const star = new THREE.Mesh(
    new THREE.OctahedronGeometry(.22),
    material("#ffd35b", .25, .4)
  );
  star.position.set(-3, 3.1, -2);
  roomGroup.add(star);

  // 雪・星の粒
  if (state.room === "snow" || state.room === "night") {
    const count = 450;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      positions[i * 3] = (Math.random() - .5) * 18;
      positions[i * 3 + 1] = Math.random() * 10;
      positions[i * 3 + 2] = (Math.random() - .5) * 18;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );
    const points = new THREE.Points(
      geometry,
      new THREE.PointsMaterial({
        color: "#ffffff",
        size: .045,
        transparent: true,
        opacity: .8
      })
    );
    roomGroup.add(points);
  }
}

/* =========================================================
   味プリセット・UI
========================================================= */
const flavors = {
  strawberry: ["#fff1e8", "#e9ad67", "#6b352d"],
  chocolate: ["#8b5b4d", "#583b32", "#351b19"],
  matcha: ["#b6c99a", "#d8b77b", "#45603b"],
  blueberry: ["#c4c6f0", "#d5ad8c", "#403b70"]
};

$("flavor").addEventListener("change", () => {
  const values = flavors[$("flavor").value];
  state.flavor = $("flavor").value;
  state.cream = values[0];
  state.sponge = values[1];
  state.chocolate = values[2];
  syncInputs();
  commitChange();
});

function syncInputs() {
  $("creamColor").value = state.cream;
  $("spongeColor").value = state.sponge;
  $("chocoColor").value = state.chocolate;
  $("flavor").value = state.flavor;
  $("cakeName").value = state.title;
  $("cakeMessage").value = state.message;
  $("room").value = state.room;
  $("cakeTitle").textContent = "🎂 " + state.title;
}

$("creamColor").addEventListener("input", () => {
  state.cream = $("creamColor").value;
  commitChange();
});
$("spongeColor").addEventListener("input", () => {
  state.sponge = $("spongeColor").value;
  commitChange();
});
$("chocoColor").addEventListener("input", () => {
  state.chocolate = $("chocoColor").value;
  commitChange();
});
$("room").addEventListener("change", () => {
  state.room = $("room").value;
  commitChange();
});
$("messageButton").addEventListener("click", () => {
  state.message = $("cakeMessage").value.trim();
  commitChange();
});
$("renameButton").addEventListener("click", () => {
  state.title = $("cakeName").value.trim() || "Cake Share";
  commitChange();
});

/* =========================================================
   履歴・Undo / Redo
========================================================= */
function snapshot() {
  state.decorations = serializeDecorations();
  return JSON.stringify(state);
}

function initializeHistory() {
  if (!lastSnapshot) {
    lastSnapshot = snapshot();
    undoStack = [];
    redoStack = [];
  }
}

function commitChange() {
  if (applyingRemote) return;

  const previous = lastSnapshot;
  const next = snapshot();

  if (previous !== next) {
    undoStack.push(previous);
    if (undoStack.length > 80) undoStack.shift();
    redoStack = [];
    lastSnapshot = next;
  }

  renderState();
  saveLocal();
  scheduleRemoteSave();
  recordHistory();
}

function applySnapshot(value) {
  applyingRemote = true;
  state = JSON.parse(value);
  cakeTitle = state.title;
  syncInputs();
  buildCake();
  buildRoom();
  lastSnapshot = snapshot();
  applyingRemote = false;
  saveLocal();
}

$("undoButton").addEventListener("click", () => {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  scheduleRemoteSave();
});

$("redoButton").addEventListener("click", () => {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  scheduleRemoteSave();
});

function renderState() {
  cakeTitle = state.title;
  syncInputs();
  buildCake();
  buildRoom();
}

/* =========================================================
   オブジェクト操作
========================================================= */
function addDecoration(type) {
  const angle = Math.random() * Math.PI * 2;
  const radius = .55 + Math.random() * .3;
  const obj = createDecoration(
    type,
    new THREE.Vector3(
      Math.cos(angle) * radius,
      1.68,
      Math.sin(angle) * radius
    )
  );
  selectedObject = obj;
  commitChange();
}

document.querySelectorAll("[data-add]").forEach(button => {
  button.addEventListener("click", () => {
    addDecoration(button.dataset.add);
  });
});

document.querySelectorAll("[data-move]").forEach(button => {
  button.addEventListener("click", () => {
    if (!selectedObject) {
      toast("先にオブジェクトを選択してください");
      return;
    }
    const step = .12;
    const directions = {
      left: [-step, 0, 0],
      right: [step, 0, 0],
      front: [0, 0, step],
      back: [0, 0, -step],
      up: [0, step, 0],
      down: [0, -step, 0]
    };
    const d = directions[button.dataset.move];
    selectedObject.position.x += d[0];
    selectedObject.position.y += d[1];
    selectedObject.position.z += d[2];
    commitChange();
  });
});

$("rotateButton").addEventListener("click", () => {
  if (!selectedObject) return;
  selectedObject.rotation.y += Math.PI / 8;
  commitChange();
});

$("deleteButton").addEventListener("click", () => {
  if (!selectedObject) return;
  decorationGroup.remove(selectedObject);
  decorations = decorations.filter(x => x !== selectedObject);
  selectedObject = null;
  commitChange();
});

/* =========================================================
   ポインター・タッチ操作
========================================================= */
let pointerDown = null;
let dragging = false;
let previousPointer = { x: 0, y: 0 };

canvas.addEventListener("pointerdown", event => {
  pointerDown = { x: event.clientX, y: event.clientY };
  previousPointer = { x: event.clientX, y: event.clientY };
  dragging = false;
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", event => {
  if (!pointerDown || cardboardMode || gyroEnabled) return;

  const dx = event.clientX - previousPointer.x;
  const dy = event.clientY - previousPointer.y;

  if (Math.abs(event.clientX - pointerDown.x) > 5 ||
      Math.abs(event.clientY - pointerDown.y) > 5) {
    dragging = true;
  }

  if (dragging) {
    camera.position.applyAxisAngle(
      new THREE.Vector3(0, 1, 0),
      -dx * .005
    );
    camera.position.y = THREE.MathUtils.clamp(
      camera.position.y - dy * .012, 1.2, 7
    );
    camera.lookAt(0, 1, 0);
  }

  previousPointer = { x: event.clientX, y: event.clientY };
});

canvas.addEventListener("pointerup", event => {
  if (!dragging && pointerDown) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObjects(
      decorationGroup.children, true
    );

    if (hits.length) {
      let target = hits[0].object;
      while (target.parent && target.parent !== decorationGroup) {
        target = target.parent;
      }
      selectedObject = target;
      toast("オブジェクトを選択しました");
    } else {
      selectedObject = null;
    }
  }
  pointerDown = null;
});

/* =========================================================
   ローカル保存
========================================================= */
const storageKey = "cake-share-" + cakeId;

function saveLocal() {
  try {
    localStorage.setItem(storageKey, snapshot());
  } catch (error) {
    console.warn(error);
    toast("保存できませんでした");
  }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(storageKey);
    if (raw) {
      state = JSON.parse(raw);
      syncInputs();
      buildCake();
      buildRoom();
    }
  } catch (error) {
    console.warn("Local data load failed", error);
  }
}

$("saveButton").addEventListener("click", () => {
  saveLocal();
  toast("この端末に保存しました");
});

$("shareButton").addEventListener("click", async () => {
  const url = new URL(location.href);
  url.searchParams.set("cake", cakeId);

  try {
    await navigator.clipboard.writeText(url.href);
    toast("共有リンクをコピーしました");
  } catch {
    prompt("共有リンクをコピーしてください", url.href);
  }
});

/* =========================================================
   編集履歴
========================================================= */
function recordHistory() {
  if (!editorName) return;
  const key = "cake-share-history-" + cakeId;
  let history = [];
  try {
    history = JSON.parse(localStorage.getItem(key) || "[]");
  } catch {}
  history.unshift({
    name: editorName,
    time: new Date().toISOString(),
    action: "編集"
  });
  history = history.slice(0, 100);
  localStorage.setItem(key, JSON.stringify(history));
}

/* =========================================================
   Supabase（任意）
========================================================= */
async function connectSupabase() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    setStatus("ローカルモード：Supabase未設定");
    return;
  }

  try {
    const { createClient } = await import(
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    );
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { data, error } = await supabase
      .from("cake_share_states")
      .select("state")
      .eq("cake_id", cakeId)
      .maybeSingle();

    if (error) throw error;

    if (data?.state) {
      const remote = JSON.stringify(data.state);
      if (remote !== lastSnapshot) {
        applySnapshot(remote);
      }
    } else {
      await uploadRemote();
    }

    realtimeChannel = supabase
      .channel("cake-" + cakeId)
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "cake_share_states",
          filter: "cake_id=eq." + cakeId
        },
        payload => {
          if (!payload.new?.state) return;
          const incoming = JSON.stringify(payload.new.state);
          if (incoming !== lastSnapshot) {
            applySnapshot(incoming);
            toast("ほかの人の編集を受信しました");
          }
        }
      )
      .subscribe();

    setStatus("Supabase接続済み");
  } catch (error) {
    console.error(error);
    setStatus("Supabase接続失敗：ローカルモードで動作中");
  }
}

async function uploadRemote() {
  if (!supabase) return;

  const current = JSON.parse(snapshot());

  const { error } = await supabase
    .from("cake_share_states")
    .upsert({
      cake_id: cakeId,
      state: current,
      updated_at: new Date().toISOString()
    }, {
      onConflict: "cake_id"
    });

  if (error) {
    console.error(error);
    setStatus("同期エラー：ローカル保存は継続中");
  }
}

function scheduleRemoteSave() {
  if (!supabase) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(uploadRemote, 500);
}

/* =========================================================
   Cardboard レンズ向けステレオ表示
========================================================= */
let leftTarget, rightTarget;
let vrScene, vrCamera;
let leftCamera, rightCamera;
let vrMaterial;
let vrQuad;
const IPD = 0.064;
const LENS_STRENGTH = 0.22;

function setupCardboard() {
  const width = Math.max(1, Math.floor(innerWidth / 2));
  const height = Math.max(1, innerHeight);

  leftTarget?.dispose();
  rightTarget?.dispose();

  leftTarget = new THREE.WebGLRenderTarget(width, height);
  rightTarget = new THREE.WebGLRenderTarget(width, height);

  leftCamera = camera.clone();
  rightCamera = camera.clone();

  const distortionVertex = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `;

  const distortionFragment = `
    uniform sampler2D leftEye;
    uniform sampler2D rightEye;
    uniform float strength;
    varying vec2 vUv;

    vec2 distort(vec2 uv) {
      vec2 centered = uv * 2.0 - 1.0;
      float r2 = dot(centered, centered);
      float factor = 1.0 + strength * r2;
      return centered * factor * 0.5 + 0.5;
    }

    void main() {
      bool isRight = vUv.x > 0.5;
      vec2 localUv = vec2(
        isRight ? (vUv.x - 0.5) * 2.0 : vUv.x * 2.0,
        vUv.y
      );

      // 左右レンズそれぞれの中心を基準に補正
      vec2 uv = distort(localUv);

      // レンズ外周の黒いマスク
      vec2 p = localUv * 2.0 - 1.0;
      float radius = length(p);
      if (radius > 1.0 || any(lessThan(uv, vec2(0.0))) ||
          any(greaterThan(uv, vec2(1.0)))) {
        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
        return;
      }

      vec4 color = isRight
        ? texture2D(rightEye, uv)
        : texture2D(leftEye, uv);

      float vignette = smoothstep(1.0, 0.72, radius);
      gl_FragColor = vec4(color.rgb * vignette, 1.0);
    }
  `;

  vrScene = new THREE.Scene();
  vrCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  vrMaterial = new THREE.ShaderMaterial({
    uniforms: {
      leftEye: { value: leftTarget.texture },
      rightEye: { value: rightTarget.texture },
      strength: { value: LENS_STRENGTH }
    },
    vertexShader: distortionVertex,
    fragmentShader: distortionFragment,
    depthTest: false,
    depthWrite: false
  });

  vrQuad = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    vrMaterial
  );
  vrScene.add(vrQuad);
}

function setEyeCameras() {
  leftCamera.copy(camera);
  rightCamera.copy(camera);

  const rightVector = new THREE.Vector3(1, 0, 0)
    .applyQuaternion(camera.quaternion);

  leftCamera.position.addScaledVector(rightVector, -IPD / 2);
  rightCamera.position.addScaledVector(rightVector, IPD / 2);

  leftCamera.updateMatrixWorld();
  rightCamera.updateMatrixWorld();
}

function renderCardboard() {
  if (!leftTarget || !rightTarget) setupCardboard();

  setEyeCameras();

  renderer.setRenderTarget(leftTarget);
  renderer.clear();
  renderer.render(scene, leftCamera);

  renderer.setRenderTarget(rightTarget);
  renderer.clear();
  renderer.render(scene, rightCamera);

  renderer.setRenderTarget(null);
  renderer.setScissorTest(false);
  renderer.clear();
  renderer.render(vrScene, vrCamera);
}

async function enterCardboard() {
  if (cardboardMode) return;

  cardboardMode = true;
  document.body.classList.add("cardboard");

  setupCardboard();
  resize();

  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") {
        toast("ジャイロの許可が必要です");
      }
    }
    gyroEnabled = true;
    window.addEventListener("deviceorientation", onDeviceOrientation, true);
  } catch (error) {
    console.warn(error);
    toast("ジャイロを利用できません");
  }

  toast("Cardboard鑑賞モード");
}

function exitCardboard() {
  cardboardMode = false;
  gyroEnabled = false;
  document.body.classList.remove("cardboard");
  window.removeEventListener("deviceorientation", onDeviceOrientation, true);
  resize();
  toast("通常編集モードに戻りました");
}

$("vrButton").addEventListener("click", enterCardboard);
$("vrExit").addEventListener("click", exitCardboard);

/* =========================================================
   ジャイロ
========================================================= */
function onDeviceOrientation(event) {
  if (!gyroEnabled || event.alpha == null) return;

  const alpha = THREE.MathUtils.degToRad(event.alpha);
  const beta = THREE.MathUtils.degToRad(event.beta || 0);
  const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

  const deviceEuler = new THREE.Euler(beta, alpha, -gamma, "YXZ");
  const deviceQuaternion = new THREE.Quaternion()
    .setFromEuler(deviceEuler);

  const screenAngle = THREE.MathUtils.degToRad(
    screen.orientation?.angle || 0
  );
  const screenQuaternion = new THREE.Quaternion()
    .setFromAxisAngle(new THREE.Vector3(0, 0, 1), -screenAngle);

  camera.quaternion.copy(deviceQuaternion).multiply(screenQuaternion);
}

/* =========================================================
   通常ジャイロ
========================================================= */
$("gyroButton").addEventListener("click", async () => {
  if (gyroEnabled) {
    gyroEnabled = false;
    window.removeEventListener("deviceorientation", onDeviceOrientation, true);
    toast("ジャイロを停止しました");
    return;
  }

  try {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") return;
    }
    gyroEnabled = true;
    window.addEventListener("deviceorientation", onDeviceOrientation, true);
    toast("ジャイロを有効にしました");
  } catch {
    toast("この端末ではジャイロを利用できません");
  }
});

/* =========================================================
   WebXR
========================================================= */
$("xrButton").addEventListener("click", async () => {
  if (!navigator.xr) {
    toast("このブラウザはWebXRに対応していません");
    return;
  }

  try {
    const supported = await navigator.xr.isSessionSupported("immersive-vr");
    if (!supported) {
      toast("immersive-vrは利用できません");
      return;
    }

    xrSession = await navigator.xr.requestSession("immersive-vr", {
      optionalFeatures: ["local-floor", "bounded-floor"]
    });

    await renderer.xr.setSession(xrSession);
    renderer.xr.enabled = true;

    xrSession.addEventListener("end", () => {
      renderer.xr.enabled = false;
      xrSession = null;
    });

    toast("WebXRを開始しました");
  } catch (error) {
    console.error(error);
    toast("WebXRを開始できませんでした");
  }
});

/* =========================================================
   リサイズ・描画
========================================================= */
function resize() {
  const width = Math.max(1, $("stage").clientWidth);
  const height = Math.max(1, $("stage").clientHeight);

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height, false);

  if (cardboardMode) {
    setupCardboard();
  }
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => {
  setTimeout(resize, 250);
});

function animate() {
  requestAnimationFrame(animate);

  if (renderer.xr.isPresenting) {
    renderer.render(scene, camera);
    return;
  }

  if (cardboardMode) {
    renderCardboard();
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }
}

/* =========================================================
   起動
========================================================= */
loadLocal();
renderState();
initializeHistory();
resize();
connectSupabase();
animate();

</script>
