<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b32">
  <meta name="description" content="みんなでひとつのケーキをデコレーションするCake Share">
  <title>Cake Share — みんなで作る3Dケーキ</title>
  <style>
    :root {
      color-scheme: light;
      --green:#173b32; --green2:#285747; --cream:#fbf5eb; --paper:#fffdf9;
      --ink:#342c27; --muted:#82766d; --line:#e8ded1; --gold:#d5a64b;
      --shadow:0 12px 35px rgba(49,35,24,.10);
    }
    * { box-sizing:border-box }
    html,body { margin:0; min-height:100%; background:var(--cream); color:var(--ink);
      font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif }
    button,input,select { font:inherit }
    button { cursor:pointer }
    .topbar { height:64px; display:flex; align-items:center; justify-content:space-between;
      padding:0 22px; background:var(--green); color:#fff; position:relative; z-index:2 }
    .brand { font-weight:850; letter-spacing:.03em; font-size:20px }
    .brand span { color:#f1d69c }
    .top-right { display:flex; align-items:center; gap:10px; font-size:12px; color:#dbe9df }
    .live-dot { width:8px;height:8px;border-radius:50%;background:#8bd4a0;display:inline-block;margin-right:5px }
    .app { max-width:1440px; margin:auto; padding:20px; }
    .heading { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:2px 0 16px }
    h1 { font-size:clamp(21px,3vw,30px); margin:0 0 4px; letter-spacing:.01em }
    .sub { color:var(--muted); font-size:13px }
    .name-chip { border:1px solid var(--line); border-radius:999px; background:#fff; padding:9px 13px; font-size:12px }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:stretch }
    .stage-card,.panel { background:var(--paper); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden }
    .stage-head { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line) }
    .stage-head strong { font-size:13px }
    .stage-head small { color:var(--muted) }
    #stage { width:100%; height:min(66vh,680px); min-height:390px; display:block; touch-action:none; background:#d9c5a8 }
    .stage-tools { display:flex; gap:8px; flex-wrap:wrap; padding:12px 14px; border-top:1px solid var(--line) }
    .toolbtn,.primary,.secondary { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:11px; padding:10px 12px; font-size:12px; font-weight:700 }
    .toolbtn:hover,.secondary:hover { background:#f6efe5 }
    .primary { background:var(--green); color:white; border-color:var(--green) }
    .primary:hover { background:var(--green2) }
    .panel { padding:16px; display:flex; flex-direction:column; gap:17px }
    .section h2 { margin:0 0 10px; font-size:14px }
    .section p { margin:0 0 9px; color:var(--muted); font-size:11px; line-height:1.6 }
    .field { display:flex; flex-direction:column; gap:6px; margin:8px 0 }
    label { font-size:11px; color:var(--muted); font-weight:700 }
    input[type="text"],select { width:100%; min-width:0; border:1px solid var(--line); border-radius:10px; padding:10px 11px; background:#fff; color:var(--ink); outline:none }
    input:focus,select:focus { border-color:#8cae9b; box-shadow:0 0 0 3px rgba(40,87,71,.10) }
    input[type="color"] { width:44px; height:36px; padding:2px; border:1px solid var(--line); border-radius:9px; background:#fff }
    .color-row { display:flex; align-items:center; gap:9px }
    .color-row input[type="text"] { flex:1 }
    .swatches { display:grid; grid-template-columns:repeat(4,1fr); gap:7px }
    .swatch { border:1px solid var(--line); border-radius:10px; background:#fff; padding:8px 4px; font-size:10px; color:var(--ink) }
    .swatch i { display:block; width:100%; height:22px; border-radius:6px; margin-bottom:5px }
    .history { display:flex; flex-direction:column; gap:8px; max-height:180px; overflow:auto }
    .history-item { display:flex; gap:8px; align-items:flex-start; font-size:11px; line-height:1.45; padding:8px; background:#f8f3eb; border-radius:9px }
    .history-item time { display:block; color:var(--muted); font-size:10px; margin-top:2px }
    .empty { color:var(--muted); font-size:11px; padding:8px 0 }
    .notice { color:var(--muted); font-size:10px; line-height:1.5 }
    .modal-backdrop { position:fixed; inset:0; z-index:10; background:rgba(17,35,29,.72); display:grid; place-items:center; padding:20px }
    .modal { width:min(100%,420px); background:var(--paper); border-radius:22px; padding:25px; box-shadow:0 25px 80px #0005 }
    .modal-mark { font-size:38px; text-align:center }
    .modal h2 { text-align:center; margin:8px 0 5px; font-size:23px }
    .modal p { text-align:center; color:var(--muted); font-size:12px; line-height:1.6; margin:0 0 18px }
    .modal .primary { width:100%; margin-top:12px; padding:13px }
    .hidden { display:none !important }
    .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#203d32; color:#fff; padding:11px 16px; border-radius:999px; font-size:12px; z-index:20; opacity:0; pointer-events:none; transition:opacity .2s }
    .toast.show { opacity:1 }
    @media(max-width:850px) {
      .app { padding:13px }
      .workspace { grid-template-columns:1fr }
      #stage { height:52vh; min-height:330px; max-height:560px }
      .panel { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px }
      .section.history-section { grid-column:1/-1 }
    }
    @media(max-width:520px) {
      .topbar { height:56px; padding:0 14px }
      .brand { font-size:18px }
      .top-right .status-text { display:none }
      .app { padding:10px }
      .heading { align-items:flex-start; flex-direction:column; margin:4px 2px 12px }
      .name-chip { align-self:flex-start }
      .stage-card,.panel { border-radius:15px }
      .stage-head { padding:10px 12px }
      #stage { height:46svh; min-height:290px; max-height:470px }
      .stage-tools { padding:9px; gap:6px }
      .toolbtn { flex:1; padding:10px 7px }
      .panel { grid-template-columns:1fr 1fr; padding:13px; gap:13px }
      .section h2 { font-size:13px }
      .section.history-section { grid-column:1/-1 }
      .swatches { grid-template-columns:repeat(2,1fr) }
    }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; transition:none !important } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🎂 Cake <span>Share</span></div>
    <div class="top-right"><span><i class="live-dot"></i><span class="status-text">3D EDITOR PREVIEW</span></span><span>🎄</span></div>
  </header>

  <main class="app">
    <div class="heading">
      <div><h1 id="cakeTitle">みんなのクリスマスケーキ</h1><div class="sub">ひとつのケーキを、みんなでデコレーション。</div></div>
      <div class="name-chip">編集者：<strong id="currentName">未入力</strong></div>
    </div>

    <div class="workspace">
      <section class="stage-card">
        <div class="stage-head"><strong>3Dケーキエディター</strong><small>ドラッグで視点を回転 · ピンチで拡大</small></div>
        <canvas id="stage" aria-label="3Dケーキ編集画面"></canvas>
        <div class="stage-tools">
          <button class="toolbtn" id="resetView">視点リセット</button>
          <button class="toolbtn" id="addBerry">🍓 イチゴ追加</button>
          <button class="toolbtn" id="addCandle">🕯️ ろうそく追加</button>
          <button class="toolbtn" id="addPlate">💌 プレート追加</button>
          <button class="toolbtn" id="removeSelected">選択を削除</button>
        </div>
      </section>

      <aside class="panel">
        <section class="section">
          <h2>🎄 お部屋</h2>
          <div class="field"><label for="roomPreset">背景テーマ</label>
            <select id="roomPreset">
              <option value="classic">クラシックリビング</option>
              <option value="snow">雪降る山小屋</option>
              <option value="nordic">北欧クリスマス</option>
              <option value="party">クリスマスパーティー</option>
              <option value="night">星空のクリスマス</option>
            </select>
          </div>
        </section>

        <section class="section">
          <h2>🍰 ケーキの味・色</h2>
          <div class="field"><label for="flavor">味のプリセット</label>
            <select id="flavor">
              <option value="strawberry">ストロベリー</option>
              <option value="chocolate">チョコレート</option>
              <option value="matcha">抹茶</option>
              <option value="blueberry">ブルーベリー</option>
              <option value="custom">カスタム</option>
            </select>
          </div>
          <div class="field"><label>クリーム RGB / HEX</label>
            <div class="color-row"><input id="creamColor" type="color" value="#fff0e8"><input id="creamHex" type="text" value="#fff0e8" maxlength="7" aria-label="クリームのHEXカラー"></div>
          </div>
          <div class="field"><label>スポンジ RGB / HEX</label>
            <div class="color-row"><input id="spongeColor" type="color" value="#e9bd82"><input id="spongeHex" type="text" value="#e9bd82" maxlength="7" aria-label="スポンジのHEXカラー"></div>
          </div>
          <div class="field"><label>メッセージチョコ RGB / HEX</label>
            <div class="color-row"><input id="chocoColor" type="color" value="#6b382c"><input id="chocoHex" type="text" value="#6b382c" maxlength="7" aria-label="メッセージチョコのHEXカラー"></div>
          </div>
        </section>

        <section class="section">
          <h2>💌 メッセージ</h2>
          <div class="field"><label for="messageText">プレートに表示する文字</label><input id="messageText" type="text" maxlength="24" placeholder="Merry Christmas!"></div>
          <button class="secondary" id="updateMessage">文字を反映</button>
        </section>

        <section class="section history-section">
          <h2>📝 編集履歴</h2>
          <div class="history" id="history"><div class="empty">編集すると、ここに履歴が表示されます。</div></div>
          <div class="notice">この試作版の履歴は、この端末内だけに保存されます。複数人での共有・同期は次の開発段階でSupabaseに接続します。</div>
        </section>
      </aside>
    </div>
  </main>

  <div class="modal-backdrop" id="nameModal">
    <form class="modal" id="nameForm">
      <div class="modal-mark">🎄🎂</div>
      <h2>ケーキ作りに参加しよう！</h2>
      <p>編集を始める前に、みんなに表示する名前を入力してください。<br>本名でなく、ニックネームでもOK。</p>
      <div class="field"><label for="displayName">あなたの名前</label><input id="displayName" type="text" maxlength="20" placeholder="例：サンタさん" autocomplete="nickname" required></div>
      <button class="primary" type="submit">この名前で参加する</button>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.querySelector("#stage");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(5.8, 4.5, 7.4);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 4;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight(0xffe9d1, 0x584333, 2.0));
    const keyLight = new THREE.DirectionalLight(0xffe4bd, 3.0);
    keyLight.position.set(-4, 8, 5); keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024,1024); scene.add(keyLight);
    const fillLight = new THREE.PointLight(0xffc66e, 35, 16);
    fillLight.position.set(4,3,2); scene.add(fillLight);

    const cakeGroup = new THREE.Group(); scene.add(cakeGroup);
    const roomGroup = new THREE.Group(); scene.add(roomGroup);
    const decorGroup = new THREE.Group(); cakeGroup.add(decorGroup);
    const material = (color, roughness=.72) => new THREE.MeshStandardMaterial({ color, roughness });
    let creamMat = material("#fff0e8"), spongeMat = material("#e9bd82"), chocolateMat = material("#6b382c");
    let selected = null;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const editableObjects = [];

    function cylinder(radiusTop, radiusBottom, height, mat, y, segments=64) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop,radiusBottom,height,segments),mat);
      mesh.position.y=y; mesh.castShadow=true; mesh.receiveShadow=true; cakeGroup.add(mesh); return mesh;
    }
    const table = new THREE.Mesh(new THREE.CylinderGeometry(4.1,4.1,.22,64), material("#76513a"));
    table.position.y=.12; table.receiveShadow=true; table.castShadow=true; scene.add(table);
    const tableLeg = new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.5,24),material("#513727"));
    tableLeg.position.y=-.72; scene.add(tableLeg);
    let plate;
    function buildCake() {
      [...cakeGroup.children].forEach(o => { if(o !== decorGroup) { cakeGroup.remove(o); disposeObject(o); } });
      cylinder(1.55,1.62,.48,spongeMat,.62);
      cylinder(1.58,1.58,.13,creamMat,.93);
      cylinder(1.34,1.4,.43,spongeMat,1.2);
      cylinder(1.38,1.38,.13,creamMat,1.48);
      cylinder(1.39,1.39,.09,creamMat,1.58);
      // Cream swirls around the upper edge
      for(let i=0;i<12;i++){
        const a=i*Math.PI*2/12, r=1.18;
        const dollop=new THREE.Mesh(new THREE.SphereGeometry(.16,18,14),creamMat);
        dollop.position.set(Math.cos(a)*r,1.68,Math.sin(a)*r);
        dollop.scale.set(1,1.15,1); dollop.castShadow=true; cakeGroup.add(dollop);
      }
      // Front-facing chocolate message plate
      plate = new THREE.Mesh(new THREE.BoxGeometry(1.05,.08,.48),chocolateMat);
      plate.position.set(0,1.73,.15); plate.rotation.x=-.12; plate.castShadow=true; cakeGroup.add(plate);
      addMessageText();
    }
    let messageMesh;
    function addMessageText() {
      if(messageMesh){ cakeGroup.remove(messageMesh); disposeObject(messageMesh); }
      const text=document.querySelector("#messageText").value.trim() || "Merry Christmas!";
      const canvasText=document.createElement("canvas"); canvasText.width=512; canvasText.height=128;
      const ctx=canvasText.getContext("2d");
      ctx.clearRect(0,0,512,128); ctx.fillStyle="#fff7e8"; ctx.font="bold 46px Georgia, serif";
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(text,256,66,480);
      const tex=new THREE.CanvasTexture(canvasText); tex.colorSpace=THREE.SRGBColorSpace;
      const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide});
      messageMesh=new THREE.Mesh(new THREE.PlaneGeometry(.88,.22),mat);
      messageMesh.position.set(0,1.78,.405); cakeGroup.add(messageMesh);
    }
    function disposeObject(obj) {
      obj.traverse?.(child=>{ child.geometry?.dispose(); if(Array.isArray(child.material)) child.material.forEach(m=>m.dispose()); else child.material?.dispose(); });
      obj.geometry?.dispose(); if(obj.material && !Array.isArray(obj.material)) obj.material.dispose();
    }
    function addDecoration(type) {
      let obj;
      if(type==="berry") {
        obj=new THREE.Group();
        const berry=new THREE.Mesh(new THREE.SphereGeometry(.16,20,16),material("#c92335",.4));
        berry.scale.set(.85,1.15,.85); berry.position.y=.13; berry.castShadow=true; obj.add(berry);
        const leaf=new THREE.Mesh(new THREE.ConeGeometry(.07,.16,5),material("#347447"));
        leaf.position.y=.29; leaf.rotation.z=.3; obj.add(leaf);
        obj.position.set((Math.random()-.5)*1.5,1.77,(Math.random()-.5)*1.3);
      } else if(type==="candle") {
        obj=new THREE.Group();
        const stick=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.55,16),material("#f5e8d0"));
        stick.position.y=.28; stick.castShadow=true; obj.add(stick);
        const flame=new THREE.Mesh(new THREE.SphereGeometry(.075,12,12),new THREE.MeshBasicMaterial({color:"#ffb52e"}));
        flame.scale.set(.65,1.5,.65); flame.position.y=.62; obj.add(flame);
        obj.position.set((Math.random()-.5)*1.2,1.72,(Math.random()-.5)*1.1);
      } else if(type==="plate") {
        obj=new THREE.Mesh(new THREE.BoxGeometry(.7,.07,.38),chocolateMat.clone());
        obj.position.set((Math.random()-.5)*.8,1.72,(Math.random()-.5)*.8);
      }
      if(!obj) return;
      obj.userData.editable=true; obj.userData.kind=type; decorGroup.add(obj); editableObjects.push(obj); selected=obj;
      logAction(type==="berry"?"イチゴを追加":type==="candle"?"ろうそくを追加":"チョコプレートを追加");
    }

    const roomThemes = {
      classic:{wall:"#263e36",floor:"#76543d",light:"#ffcf8b",snow:false},
      snow:{wall:"#617a89",floor:"#8a7561",light:"#ffe5c1",snow:true},
      nordic:{wall:"#d8d0bd",floor:"#ad9477",light:"#fff0d2",snow:false},
      party:{wall:"#641f2b",floor:"#53352d",light:"#ffce7b",snow:false},
      night:{wall:"#101d3c",floor:"#343b5b",light:"#9bbdff",snow:true}
    };
    function buildRoom(themeName) {
      while(roomGroup.children.length){const o=roomGroup.children.pop(); disposeObject(o);}
      const t=roomThemes[themeName] || roomThemes.classic;
      scene.background=new THREE.Color(t.wall);
      const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),material(t.floor));
      floor.rotation.x=-Math.PI/2; floor.position.y=-.02; floor.receiveShadow=true; roomGroup.add(floor);
      const backWall=new THREE.Mesh(new THREE.PlaneGeometry(16,9),material(t.wall));
      backWall.position.set(0,4,-5); roomGroup.add(backWall);
      // Window frame and snowy view
      const windowMat=material(themeName==="night"?"#182e57":"#9bb8c5",.3);
      const windowPane=new THREE.Mesh(new THREE.PlaneGeometry(3.2,2.2),windowMat);
      windowPane.position.set(-3,3.1,-4.92); roomGroup.add(windowPane);
      const frameMat=material("#5a3c2d");
      for(const [x,y,w,h] of [[-3,4.22,3.35,.09],[-3,2,3.35,.09],[-4.62,3.1,.09,2.3],[-1.38,3.1,.09,2.3],[-3,3.1,.07,2.2],[-3,3.1,3.2,.07]]){
        const bar=new THREE.Mesh(new THREE.BoxGeometry(w,h,.12),frameMat); bar.position.set(x,y,-4.82); roomGroup.add(bar);
      }
      const roomLight=new THREE.PointLight(t.light,themeName==="night"?18:28,18); roomLight.position.set(0,5,2); roomGroup.add(roomLight);
      if(themeName==="classic"||themeName==="party"||themeName==="snow"){
        const tree=new THREE.Group();
        const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.7,12),material("#68442e")); trunk.position.y=.35; tree.add(trunk);
        for(let i=0;i<3;i++){const cone=new THREE.Mesh(new THREE.ConeGeometry(1.0-i*.19,1.35,24),material("#1f6547"));cone.position.y=1.0+i*.75;cone.castShadow=true;tree.add(cone);}
        for(let i=0;i<18;i++){const a=i*2.4,r=.35+(i%6)*.1,y=.6+(i%6)*.47;const bulb=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),new THREE.MeshBasicMaterial({color:["#ffd36a","#e95b55","#6bc8d0"][i%3]}));bulb.position.set(Math.cos(a)*r,y,Math.sin(a)*r);tree.add(bulb);}
        tree.position.set(3.0,0,-2.4); roomGroup.add(tree);
      }
      if(t.snow){
        const points=[];
        for(let i=0;i<260;i++) points.push((Math.random()-.5)*8,Math.random()*6+1,-4.65+(Math.random()-.5)*.1);
        const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.Float32BufferAttribute(points,3));
        const flakes=new THREE.Points(geo,new THREE.PointsMaterial({color:"#fff",size:.045,transparent:true,opacity:.85}));
        roomGroup.add(flakes);
      }
    }

    function setColor(inputId, mat, hexId) {
      const value=document.getElementById(inputId).value;
      mat.color.set(value);
      document.getElementById(hexId).value=value;
    }
    function bindColor(colorId,hexId,mat) {
      const c=document.getElementById(colorId), h=document.getElementById(hexId);
      c.addEventListener("input",()=>{mat.color.set(c.value);h.value=c.value;logAction("色を変更");});
      h.addEventListener("change",()=>{if(/^#[0-9a-fA-F]{6}$/.test(h.value)){c.value=h.value;mat.color.set(h.value);logAction("色を変更");}else h.value=c.value;});
    }
    bindColor("creamColor","creamHex",creamMat);
    bindColor("spongeColor","spongeHex",spongeMat);
    bindColor("chocoColor","chocoHex",chocolateMat);

    document.querySelector("#flavor").addEventListener("change",e=>{
      const presets={strawberry:["#fff0e8","#e9bd82","#6b382c"],chocolate:["#75452f","#b77a4c","#3d211c"],matcha:["#9caf76","#dfc79c","#51412c"],blueberry:["#c4a5d4","#e7c7a6","#50355e"]};
      if(!presets[e.target.value]) return;
      ["creamColor","spongeColor","chocoColor"].forEach((id,i)=>{document.getElementById(id).value=presets[e.target.value][i];document.getElementById(id).dispatchEvent(new Event("input"));});
      buildCake(); logAction("ケーキの味を変更");
    });
    document.querySelector("#roomPreset").addEventListener("change",e=>{buildRoom(e.target.value);logAction("部屋の背景を変更");});
    document.querySelector("#updateMessage").addEventListener("click",()=>{addMessageText();logAction("メッセージを変更");});
    document.querySelector("#addBerry").addEventListener("click",()=>addDecoration("berry"));
    document.querySelector("#addCandle").addEventListener("click",()=>addDecoration("candle"));
    document.querySelector("#addPlate").addEventListener("click",()=>addDecoration("plate"));
    document.querySelector("#resetView").addEventListener("click",()=>{camera.position.set(5.8,4.5,7.4);controls.target.set(0,1.15,0);controls.update();});
    document.querySelector("#removeSelected").addEventListener("click",()=>{
      if(!selected){toast("削除するアイテムを選択してください");return;}
      decorGroup.remove(selected); const i=editableObjects.indexOf(selected); if(i>=0)editableObjects.splice(i,1);
      disposeObject(selected); selected=null; logAction("アイテムを削除");
    });

    function logAction(action) {
      const name=sessionStorage.getItem("cakeShareName") || "ゲスト";
      const list=document.querySelector("#history");
      if(list.querySelector(".empty")) list.innerHTML="";
      const item=document.createElement("div"); item.className="history-item";
      const icon=document.createElement("span");icon.textContent="✦";
      const body=document.createElement("div");body.textContent=`${name}：${action}`;
      const time=document.createElement("time");time.textContent=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
      body.append(time);item.append(icon,body);list.prepend(item);
      while(list.children.length>30)list.lastElementChild.remove();
    }
    let toastTimer;
    function toast(msg){const el=document.querySelector("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2200);}

    // Require a display name before enabling editing.
    const modal=document.querySelector("#nameModal");
    document.querySelector("#nameForm").addEventListener("submit",e=>{
      e.preventDefault();const name=document.querySelector("#displayName").value.trim();
      if(!name){return;}
      sessionStorage.setItem("cakeShareName",name);
      document.querySelector("#currentName").textContent=name;
      modal.classList.add("hidden");
      logAction("編集に参加");
    });
    const remembered=sessionStorage.getItem("cakeShareName");
    if(remembered){document.querySelector("#currentName").textContent=remembered;modal.classList.add("hidden");}

    // Tap an object to select it; drag the scene to orbit the camera.
    canvas.addEventListener("pointerdown",e=>{
      const rect=canvas.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(pointer,camera);
      const hits=raycaster.intersectObjects(decorGroup.children,true);
      selected=hits.length?hits[0].object:null;
      if(selected){let root=selected;while(root.parent&&root.parent!==decorGroup)root=root.parent;selected=root;toast("アイテムを選択しました。削除ボタンで削除できます。");}
    });

    function resize(){
      const w=canvas.clientWidth,h=canvas.clientHeight;
      renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas);
    buildCake();buildRoom("classic");resize();
    function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
    animate();
  </script>
</body>
</html>
